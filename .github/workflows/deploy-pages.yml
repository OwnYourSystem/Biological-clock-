name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/app-creation-prep-1tu5so]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued push waits rather than cancels, so the live
# site always matches a commit that finished building.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # enablement turns Pages on for the repository the first time this runs,
      # so nobody has to click through the settings page.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Pages serves from /<repo>/, so the app is built for that subpath.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
