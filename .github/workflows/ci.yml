name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The app has no server, so a dependency audit of what ships is enough.
      - run: npm run audit
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
